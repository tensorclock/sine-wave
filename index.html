<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sine Wave Visualization</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #f8f9fa;
            --text-primary: #1a1a1a;
            --text-muted: #666666;
            --signal-color: #2563eb;
            --grid-color: #e5e7eb;
            --accent-color: #ef4444;

            --bg-dark: #111827;
            --surface-dark: #1f2937;
            --text-primary-dark: #f9fafb;
            --text-muted-dark: #9ca3af;
            --grid-dark: #374151;
        }

        body.dark-mode {
            --bg-color: var(--bg-dark);
            --surface-color: var(--surface-dark);
            --text-primary: var(--text-primary-dark);
            --text-muted: var(--text-muted-dark);
            --grid-color: var(--grid-dark);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s ease;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--surface-color);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: var(--bg-color);
            border-radius: 0 0 4px 0;
            overflow: hidden;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .theme-toggle:hover {
            background: var(--grid-color);
        }

        .stats {
            margin-top: 1rem;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: right;
        }
    </style>
</head>
<body class="dark-mode">

    <div class="container">
        <div class="header">
            <h1>Sine Wave Signal</h1>
            <div class="button-group">
                <button class="theme-toggle" onclick="document.body.classList.toggle('dark-mode')">🌓 Toggle Theme</button>
                <button class="theme-toggle" id="audio-btn" onclick="toggleAudio()">🔊 Audio: Off</button>
                <button class="theme-toggle" id="auto-color-btn" onclick="toggleAutoColor()">🎨 Auto Color: On</button>
                <button class="theme-toggle" id="auto-omega-btn" onclick="toggleAutoOmega()">🌀 Auto Speed: On</button>
                <button class="theme-toggle" id="auto-thick-btn" onclick="toggleAutoThick()">📏 Auto Thick: On</button>
                <button class="theme-toggle" id="sig1-btn" onclick="toggleSignal1()">📡 Signal 1: On</button>
                <button class="theme-toggle" id="sig2-btn" onclick="toggleSignal2()">📡 Signal 2: On</button>
                <button class="theme-toggle" onclick="toggleFlip()">↔️ Flip</button>
                <button class="theme-toggle" onclick="resetControls()">🔄 Reset</button>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Frequency <span id="freq-val">1.0 Hz</span></label>
                <input type="range" id="frequency" min="0.1" max="5" step="0.1" value="1">
            </div>
            <div class="control-group">
                <label>Amplitude <span id="amp-val">50%</span></label>
                <input type="range" id="amplitude" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="control-group">
                <label>Angular Velocity <span id="omega-val">0.05 rad/f</span></label>
                <input type="range" id="omega" min="-0.3" max="0.3" step="0.01" value="0.05">
            </div>
            <div class="control-group">
                <label>Color Hue <span id="hue-val">220°</span></label>
                <input type="range" id="hue" min="0" max="360" step="1" value="220">
            </div>
            <div class="control-group">
                <label>Thickness <span id="thick-val">2px</span></label>
                <input type="range" id="thickness" min="1" max="20" step="1" value="2">
            </div>
            <div class="control-group">
                <label>Phase Diff <span id="phase-diff-val">90°</span></label>
                <input type="range" id="phase-diff" min="0" max="360" step="1" value="90">
            </div>
            <div class="control-group">
                <label>Volume <span id="vol-val">10%</span></label>
                <input type="range" id="volume" min="0" max="1" step="0.01" value="0.1">
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="waveCanvas"></canvas>
        </div>

        <div class="stats" id="stats">
            Phase: 0.00 rad
        </div>
    </div>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        const freqInput = document.getElementById('frequency');
        const ampInput = document.getElementById('amplitude');
        const omegaInput = document.getElementById('omega');
        const hueInput = document.getElementById('hue');
        const thickInput = document.getElementById('thickness');
        const phaseDiffInput = document.getElementById('phase-diff');
        const volInput = document.getElementById('volume');
        const freqVal = document.getElementById('freq-val');
        const ampVal = document.getElementById('amp-val');
        const omegaVal = document.getElementById('omega-val');
        const hueVal = document.getElementById('hue-val');
        const thickVal = document.getElementById('thick-val');
        const phaseDiffVal = document.getElementById('phase-diff-val');
        const volVal = document.getElementById('vol-val');
        const stats = document.getElementById('stats');

        let width, height;
        let phase = 0;
        let autoColor = true;
        let autoOmega = true;
        let autoThick = true;
        let isFlipped = false;
        let signal1Enabled = true;
        let signal2Enabled = true;

        let audioCtx = null;
        let oscillatorL = null;
        let oscillatorR = null;
        let gainL = null;
        let gainR = null;
        let pannerL = null;
        let pannerR = null;
        let isAudioOn = false;

        function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            width = canvas.width;
            height = canvas.height;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', resize);
        resize();

        function draw() {
            ctx.clearRect(0, 0, width / window.devicePixelRatio, height / window.devicePixelRatio);

            const w = width / window.devicePixelRatio;
            const h = height / window.devicePixelRatio;
            const frequency = parseFloat(freqInput.value);
            const amplitude = parseFloat(ampInput.value);
            let omega = parseFloat(omegaInput.value);
            let hue = parseFloat(hueInput.value);
            let thickness = parseFloat(thickInput.value);
            const phaseDiffDeg = parseFloat(phaseDiffInput.value);
            const phaseDiffRad = (phaseDiffDeg * Math.PI) / 180;

            if (autoColor) {
                hue = (hue + 1) % 360;
                hueInput.value = hue;
            }

            if (autoOmega) {
                omega = 0 + 0.3 * Math.sin(Date.now() * 0.001);
                omegaInput.value = omega;
            }

            if (autoThick) {
                thickness = 10.5 + 9.5 * Math.sin(Date.now() * 0.002);
                thickInput.value = thickness;
            }

            freqVal.innerText = `${frequency.toFixed(1)} Hz`;
            ampVal.innerText = `${Math.round(amplitude * 100)}%`;
            omegaVal.innerText = `${omega.toFixed(2)} rad/f`;
            hueVal.innerText = `${Math.round(hue)}°`;
            thickVal.innerText = `${thickness}px`;
            phaseDiffVal.innerText = `${phaseDiffDeg}°`;
            volVal.innerText = `${Math.round(parseFloat(volInput.value) * 100)}%`;

            if (audioCtx && oscillatorL && oscillatorR) {
                const audioFreq = frequency * 100;
                const volume = isAudioOn ? parseFloat(volInput.value) : 0;

                oscillatorL.frequency.setTargetAtTime(audioFreq, audioCtx.currentTime, 0.03);
                oscillatorR.frequency.setTargetAtTime(audioFreq, audioCtx.currentTime, 0.03);
                gainL.gain.setTargetAtTime(isAudioOn && signal1Enabled ? volume : 0, audioCtx.currentTime, 0.03);
                gainR.gain.setTargetAtTime(isAudioOn && signal2Enabled ? volume : 0, audioCtx.currentTime, 0.03);
            }

            ctx.beginPath();
            ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--grid-color');
            ctx.lineWidth = 1;
            ctx.moveTo(0, h / 2);
            ctx.lineTo(w, h / 2);
            for (let x = 0; x < w; x += w / 10) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
            }
            ctx.stroke();

            // Signal 1
            if (signal1Enabled) {
                ctx.beginPath();
                ctx.strokeStyle = `hsl(${hue}, 70%, ${document.body.classList.contains('dark-mode') ? '60%' : '50%'})`;
                ctx.lineWidth = thickness;
                ctx.lineJoin = 'round';
                for (let x = 0; x <= w; x++) {
                    const t = x / w;
                    const angle = 2 * Math.PI * frequency * t + phase;
                    const y = (h / 2) + Math.sin(angle) * (h / 2 * amplitude);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // Signal 2
            if (signal2Enabled) {
                ctx.beginPath();
                ctx.strokeStyle = `hsl(${(hue + 180) % 360}, 70%, ${document.body.classList.contains('dark-mode') ? '60%' : '50%'})`;
                ctx.lineWidth = thickness;
                ctx.lineJoin = 'round';
                ctx.setLineDash([5, 5]);
                for (let x = 0; x <= w; x++) {
                    const t = x / w;
                    const angle = 2 * Math.PI * frequency * t + phase + phaseDiffRad;
                    const y = (h / 2) + Math.sin(angle) * (h / 2 * amplitude);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
                ctx.setLineDash([]);
            }

            const leadAngle = phase;
            const leadY = (h / 2) + Math.sin(leadAngle) * (h / 2 * amplitude);
            ctx.beginPath();
            ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--accent-color');
            ctx.arc(0, leadY, 4, 0, Math.PI * 2);
            ctx.fill();

            phase += omega;
            if (phase > 2 * Math.PI) phase -= 2 * Math.PI;

            stats.innerText = `Phase: ${phase.toFixed(2)} rad`;
            requestAnimationFrame(draw);
        }

        function toggleAutoColor() {
            autoColor = !autoColor;
            document.getElementById('auto-color-btn').innerText = `🎨 Auto Color: ${autoColor ? 'On' : 'Off'}`;
        }

        function toggleAutoOmega() {
            autoOmega = !autoOmega;
            document.getElementById('auto-omega-btn').innerText = `🌀 Auto Speed: ${autoOmega ? 'On' : 'Off'}`;
        }

        function toggleAutoThick() {
            autoThick = !autoThick;
            document.getElementById('auto-thick-btn').innerText = `📏 Auto Thick: ${autoThick ? 'On' : 'Off'}`;
        }

        function toggleSignal1() {
            signal1Enabled = !signal1Enabled;
            document.getElementById('sig1-btn').innerText = `📡 Signal 1: ${signal1Enabled ? 'On' : 'Off'}`;
        }

        function toggleSignal2() {
            signal2Enabled = !signal2Enabled;
            document.getElementById('sig2-btn').innerText = `📡 Signal 2: ${signal2Enabled ? 'On' : 'Off'}`;
        }

        function toggleAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                oscillatorL = audioCtx.createOscillator();
                gainL = audioCtx.createGain();
                pannerL = audioCtx.createStereoPanner();
                pannerL.pan.value = -1;
                oscillatorL.type = 'sine';
                oscillatorL.connect(gainL).connect(pannerL).connect(audioCtx.destination);
                oscillatorL.start();

                oscillatorR = audioCtx.createOscillator();
                gainR = audioCtx.createGain();
                pannerR = audioCtx.createStereoPanner();
                pannerR.pan.value = 1;
                oscillatorR.type = 'sine';
                oscillatorR.connect(gainR).connect(pannerR).connect(audioCtx.destination);
                oscillatorR.start();
            }

            isAudioOn = !isAudioOn;
            const volume = parseFloat(volInput.value);
            gainL.gain.setTargetAtTime(isAudioOn ? volume : 0, audioCtx.currentTime, 0.03);
            gainR.gain.setTargetAtTime(isAudioOn ? volume : 0, audioCtx.currentTime, 0.03);
            document.getElementById('audio-btn').innerText = `🔊 Audio: ${isAudioOn ? 'On' : 'Off'}`;
        }

        function toggleFlip() {
            isFlipped = !isFlipped;
            const container = document.querySelector('.canvas-container');
            container.style.transform = isFlipped ? 'scaleX(-1)' : 'scaleX(1)';
        }

        function resetControls() {
            freqInput.value = 1;
            ampInput.value = 0.5;
            omegaInput.value = 0.05;
            hueInput.value = 220;
            thickInput.value = 2;
            phaseDiffInput.value = 90;
            volInput.value = 0.1;
            phase = 0;
            autoColor = true;
            autoOmega = false;
            autoThick = false;
            signal1Enabled = true;
            signal2Enabled = true;
            isFlipped = false;
            document.querySelector('.canvas-container').style.transform = 'scaleX(1)';
            document.getElementById('auto-color-btn').innerText = `🎨 Auto Color: On`;
            document.getElementById('auto-omega-btn').innerText = `🌀 Auto Speed: Off`;
            document.getElementById('auto-thick-btn').innerText = `📏 Auto Thick: Off`;
            document.getElementById('sig1-btn').innerText = `📡 Signal 1: On`;
            document.getElementById('sig2-btn').innerText = `📡 Signal 2: On`;
        }

        draw();
    </script>
</body>
</html>
